services:
  db:
    image: postgres:15-alpine
    container_name: catalog_music_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: ${POSTGRES_DB:-musica_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: musica_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musica_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - test

  db-e2e:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: musica_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musica_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - test

  tests:
    build: .
    image: catalog_music_api:local
    pull_policy: never
    working_dir: /app
    volumes:
      - ./resultados:/app/resultados 
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:123456@db-test:5432/musica_test
      JWT_SECRET_KEY: chave_teste_catalog_music
      SECRET_KEY: chave_testeflask_catalog_music
    depends_on:
      db-test:
        condition: service_healthy
    profiles:
      - test
    command: ["python", "-m", "pytest"]

  web-test:
    image: catalog_music_api:local
    pull_policy: never
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:123456@db-e2e:5432/musica_e2e
      JWT_SECRET_KEY: chave_teste_catalog_music
      SECRET_KEY: chave_testeflask_catalog_music
    depends_on:
      db-e2e:
        condition: service_healthy
    profiles:
      - test
    command: >
      sh -c "flask db upgrade && exec python run.py"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)\""
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    image: ${DOCKER_IMAGE:-catalog_music_api:local}
    container_name: catalog_music_api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql+psycopg2://postgres:123456@db:5432/${POSTGRES_DB:-musica_dev}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-chave_dev_catalog_music}
      - SECRET_KEY=${SECRET_KEY:-chave_appflask_catalog_music}
    depends_on:
      - db

volumes:
  postgres_data:
  postgres_test_data: