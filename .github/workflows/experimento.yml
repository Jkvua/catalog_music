name: Experimento - Testes Automatizado/Catalog Music

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão experimental"
        required: true
        default: "piloto"
        type: string

      repeticoes:
        description: "Quantidade de repetições"
        required: true
        default: "1"
        type: string

      cenario:
        description: "Configuração experimental"
        required: true
        default: "todos"
        type: choice
        options:
          - todos
          - a
          - b
          - c

      ordem:
        description: "Ordem de execução das configurações"
        required: true
        default: "fixa"
        type: choice
        options:
          - fixa
          - balanceada

jobs:
  experimento:
    name: Execução dos cenários A, B e C
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Chackout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t catalog_music_api:local .

      - name: Obter imagem PostgreSQL
        run: docker pull postgres:15-alpine

      - name: Executar aquecimento
        run: |
          bash scripts/run-experimento.sh 1 aquecimento c fixa

      - name: Extrair métricas do aquecimento
        run: |
          python scripts/extrair-metricas.py

      - name: Validar aquecimento
        run: |
          python scripts/validar-aquecimento.py

      - name: Separar resultados do aquecimento
        run: |
          mkdir -p resultados-aquecimento

          mv resultados/aquecimento resultados-aquecimento/
          mv resultados/metricas_testes.csv resultados-aquecimento/
          mv resultados/validade_execucoes.csv resultados-aquecimento/

      - name: Executar experimento
        id: execucao_experimental
        env:
          REPETICOES: ${{ inputs.repeticoes }}
          VERSAO: ${{ inputs.versao }}
          CENARIO: ${{ inputs.cenario }}
          ORDEM: ${{ inputs.ordem }}
        run: |
          bash scripts/run-experimento.sh \
            "$REPETICOES" \
            "$VERSAO" \
            "$CENARIO" \
            "$ORDEM"

      - name: Extrair métricas experimentais
        if: ${{ always() && (steps.execucao_experimental.outcome == 'success' || steps.execucao_experimental.outcome == 'failure') }}
        run: python scripts/extrair-metricas.py

      - name: Salvar relatórios do aquecimento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-aquecimento-${{ github.run_id }}
          path: |
            resultados-aquecimento/
            resultados/aquecimento/
          if-no-files-found: warn

      - name: Salvar relatórios do experimento
        if: ${{ always() && (steps.execucao_experimental.outcome == 'success' || steps.execucao_experimental.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ inputs.versao }}-${{ github.run_id }}
          path: resultados/
          if-no-files-found: warn