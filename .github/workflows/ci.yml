name: CI/CD Pipeline - Catalog Music

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Executar Testes Automatizados (CI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: musica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente em Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar baterias de testes com pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:123456@localhost:5432/musica_test
          JWT_SECRET_KEY: chave_teste_catalog_music
          SECRET_KEY: chave_testeflask_catalog_music
        run: |
          pytest

    build-artifacts:
      name: Validar build do conteiner (CD)
      runs-on: ubuntu-latest
      needs: test

      steps:
        - name: Baixar código do repositório
        - uses: actions/checkout@v4

        - name: Construir imagem Docker da API
          run: |
            docker build -t catalog_music_api:latest .