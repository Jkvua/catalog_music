name: CI/CD Pipeline - Catalog Music

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: 1. Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t catalog_music_api:local .
      
      - name: Salvar imagem Docker
        run: docker save catalog_music_api:local -o catalog_music_api.tar

      - name: Compartilhar a imagem entre os jobs
        uses: actions/upload-artifact@v4
        with:
          name: catalog-music-image
          path: catalog_musica_api.tar
          retention-days: 1

  unitarios-tests:
    name: 2. Testes unitários
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar Imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: catalog-music-image

      - name: Carregar imagem Docker
        run: docker load -i catalog_music_api.tar

      - name: Executar testes unitários
        run: |
          docker compose --profile test run --rm \
            tests python -m pytest tests/unitarios -v --tb=short

  integracao-tests:
    name: 3. Testes de integração
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar Imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: catalog-music-image

      - name: Carregar imagem Docker
        run: docker load -i catalog_music_api.tar

      - name: Executar testes de integração
        run: |
          docker compose --profile test run --rm \
            tests python -m pytest tests/integracao -v --tb=short
  
  e2e-tests:
    name: 4. Testes E2E
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar Imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: catalog-music-image

      - name: Carregar imagem Docker
        run: docker load -i catalog_music_api.tar

      - name: Executar testes E2E
        run: bash scripts/run-e2e.sh

  docker-push:
    name: 5. Publicar imagem no Docker Hub
    runs-on: ubuntu-latest

    needs:
      - build
      - unitarios-tests
      - integracao-tests
      - e2e-tests

    if: >-
      ${{
        github.event_name == 'push' && 
        github.ref == 'refs/heads/main'
      }}

    steps:
      - name: Baixar imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: catalog-music-image

      - name: Carregar imagem Docker
        run: docker load -i catalog_music_api.tar

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagem
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag catalog_music_api:local \
            "$DOCKERHUB_USERNAME/catalog_music_api:${{ github.sha}}"

          docker push \
            "$DOCKERHUB_USERNAME/catalog_music_api:${{ github.sha}}"
