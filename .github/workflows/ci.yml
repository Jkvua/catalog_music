name: CI/CD Pipeline - Catalog Music

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: 1. Testes Base (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: musica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Base (Ignorando E2E)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:123456@localhost:5432/musica_test
          JWT_SECRET_KEY: chave_teste_catalog_music
          SECRET_KEY: chave_testeflask_catalog_music
        run: |
          python -m pytest --ignore=tests/e2e

  build-and-push:
    name: 2. Construir Imagem e Enviar ao Docker Hub
    runs-on: ubuntu-latest
    needs: test # Só empacota se os testes unitários passarem

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e Subir Imagem (Build & Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/catalog_music_api:latest

  e2e-test:
    name: 3. Testes E2E (Container Real)
    runs-on: ubuntu-latest
    needs: build-and-push # Só roda o E2E se a imagem estiver na nuvem

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python (para disparar os scripts de teste)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Instalar dependências completas para o Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Injetar variaveis no Container
        run: |
          cat <<EOF > docker-compose.override.yml
          services:
            web:
              environment:
                - SECRET_KEY=chave_testeflask_catalog_music
                - JWT_SECRET_KEY=chave_teste_catalog_music
          EOF

      - name: Orquestrar Ambiente Docker (Baixando Imagem Pronta)
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/catalog_music_api:latest
        run: |
          docker compose pull
          docker compose up --no-build -d
          sleep 10
          docker compose exec -T web flask db upgrade
        
      - name: Executar os Testes E2E
        env: 
          API_URL: "http://localhost:5000"
        run: |
          python -m pytest tests/e2e -v
      
      - name: Destruir Ambiente
        if: always()
        run: |
          docker compose down -v